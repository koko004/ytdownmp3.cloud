<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>youtubemp3.sbs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .logo-img {
      max-width: 280px;
      height: auto;
    }

    .subtitle {
      color: #8892b0;
      font-size: 1.1rem;
    }

    .converter-box {
      background: #16213e;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .url-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #233554;
      border-radius: 10px;
      background: #0a192f;
      color: #e6f1ff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .url-input:focus {
      border-color: #e94560;
    }

    .url-input::placeholder {
      color: #495670;
    }

    .format-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .format-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #233554;
      border-radius: 10px;
      background: #0a192f;
      color: #8892b0;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .format-btn.active {
      border-color: #e94560;
      background: #e94560;
      color: #fff;
    }

    .format-btn:hover:not(.active) {
      border-color: #495670;
    }

    .convert-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #e94560, #c23152);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .convert-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
    }

    .convert-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .video-info {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #0a192f;
      border-radius: 12px;
      border: 1px solid #233554;
    }

    .video-info.visible {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .video-thumb {
      width: 160px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .video-details h3 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #e6f1ff;
    }

    .video-details p {
      color: #8892b0;
      font-size: 0.875rem;
    }

    .progress-container {
      display: none;
      margin-top: 25px;
    }

    .progress-container.visible {
      display: block;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #233554;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #c23152);
      border-radius: 4px;
      transition: width 0.3s;
      width: 0%;
    }

    .progress-text {
      text-align: center;
      color: #8892b0;
      font-size: 0.9rem;
    }

    .download-btn {
      display: none;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s;
    }

    .download-btn.visible {
      display: block;
    }

    .download-btn:hover {
      transform: translateY(-2px);
    }

    .error-msg {
      display: none;
      margin-top: 15px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      border-radius: 8px;
      color: #ef4444;
      font-size: 0.9rem;
      text-align: center;
    }

    .error-msg.visible {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      margin-top: 60px;
      color: #495670;
      font-size: 0.85rem;
    }

    footer a {
      color: #e94560;
      text-decoration: none;
    }

    .paste-btn {
      padding: 14px 16px;
      border: 2px solid #233554;
      border-radius: 10px;
      background: #0a192f;
      color: #8892b0;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .paste-btn:hover {
      border-color: #e94560;
      color: #e94560;
    }

    @media (max-width: 600px) {
      .input-group { flex-direction: column; }
      .video-info.visible { flex-direction: column; align-items: flex-start; }
      .video-thumb { width: 100%; height: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="/logo.png" alt="youtubemp3.sbs" class="logo-img">
      <p class="subtitle">Convert and download YouTube videos as MP3 or MP4</p>
    </header>

    <div class="converter-box">
      <div class="input-group">
        <input type="text" class="url-input" id="urlInput"
          placeholder="Paste YouTube link here...">
        <button class="paste-btn" onclick="pasteFromClipboard()" title="Paste">&#128203;</button>
      </div>

      <div class="format-selector">
        <button class="format-btn active" data-format="mp3" onclick="selectFormat('mp3')">MP3 (Audio)</button>
        <button class="format-btn" data-format="mp4" onclick="selectFormat('mp4')">MP4 (Video)</button>
      </div>

      <button class="convert-btn" id="convertBtn" onclick="startConvert()">
        Convert
      </button>

      <div class="video-info" id="videoInfo">
        <img class="video-thumb" id="videoThumb" src="" alt="thumbnail">
        <div class="video-details">
          <h3 id="videoTitle"></h3>
          <p id="videoChannel"></p>
        </div>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-text" id="progressText">Preparing...</p>
      </div>

      <button class="download-btn" id="downloadBtn" onclick="downloadFile()">
        Download
      </button>

      <div class="error-msg" id="errorMsg"></div>
    </div>

    <footer>
      <p>No ads. No signup. Completely free.</p>
    </footer>
  </div>

  <script>
    let selectedFormat = 'mp3';
    let currentJobId = null;

    function selectFormat(fmt) {
      selectedFormat = fmt;
      document.querySelectorAll('.format-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.format === fmt);
      });
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
      } catch (e) {
        // clipboard access denied
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 6000);
    }

    function resetUI() {
      document.getElementById('videoInfo').classList.remove('visible');
      document.getElementById('progressContainer').classList.remove('visible');
      document.getElementById('downloadBtn').classList.remove('visible');
      document.getElementById('errorMsg').classList.remove('visible');
      document.getElementById('progressBar').style.width = '0%';
    }

    async function startConvert() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return showError('Please enter a YouTube link');
      if (!/youtu(\.be|be\.com)/.test(url)) return showError('The link does not appear to be from YouTube');

      const btn = document.getElementById('convertBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Converting...';
      resetUI();

      try {
        const res = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format: selectedFormat })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        currentJobId = data.jobId;
        document.getElementById('progressContainer').classList.add('visible');
        pollStatus();
      } catch (e) {
        showError(e.message || 'Error starting conversion');
        btn.disabled = false;
        btn.textContent = 'Convert';
      }
    }

    async function pollStatus() {
      if (!currentJobId) return;
      try {
        const res = await fetch(`/api/status/${currentJobId}`);
        const data = await res.json();

        const bar = document.getElementById('progressBar');
        const text = document.getElementById('progressText');

        if (data.status === 'processing') {
          bar.style.width = Math.max(data.progress || 0, 5) + '%';
          text.textContent = `Converting... ${Math.round(data.progress || 0)}%`;
          setTimeout(pollStatus, 500);
        } else if (data.status === 'done') {
          bar.style.width = '100%';
          text.textContent = 'Conversion complete! Downloading...';
          document.getElementById('convertBtn').disabled = false;
          document.getElementById('convertBtn').textContent = 'Convert';
          window.location.href = `/api/download/${currentJobId}`;
        } else {
          showError(data.error || 'Conversion error');
          document.getElementById('convertBtn').disabled = false;
          document.getElementById('convertBtn').textContent = 'Convert';
        }
      } catch (e) {
        setTimeout(pollStatus, 1000);
      }
    }

    function downloadFile() {
      if (!currentJobId) return;
      window.location.href = `/api/download/${currentJobId}`;
    }

    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startConvert();
    });
  </script>
</body>
</html>
