<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login – ytdownmp3.cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .login-logo { text-align: center; margin-bottom: 16px; }
    .login-logo img { max-width: 180px; height: auto; }
    .login-box h1 { font-size: 1.5rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px; text-align: center; }
    .login-box .subtitle { color: #94a3b8; text-align: center; margin-bottom: 32px; font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #334155; border-radius: 10px; background: #0f172a; color: #f8fafc; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #3b82f6; }
    .form-group input::placeholder { color: #64748b; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { display: none; margin-top: 16px; padding: 12px; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 8px; color: #ef4444; font-size: 0.85rem; text-align: center; }
    .error.visible { display: block; }
    .footer { margin-top: 24px; text-align: center; color: #64748b; font-size: 0.75rem; }
    .footer code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <img src="/logo-280.webp" srcset="/logo-280.webp 280w, /logo.webp 560w" sizes="180px" alt="ytdownmp3.cloud" width="180" height="180">
    </div>
    <h1>Admin Panel</h1>
    <p class="subtitle">ytdownmp3.cloud</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="footer">
      Default: <code>admin</code> / <code>changeme123</code><br>
      Set <code>ADMIN_USER</code> and <code>ADMIN_PASS</code> env vars
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorMsg');
      err.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          err.textContent = data.error || 'Login failed';
          err.classList.add('visible');
        }
      } catch (e) {
        err.textContent = 'Connection error';
        err.classList.add('visible');
      }
      btn.disabled = false;
      btn.textContent = 'Sign In';
    });
  </script>
</body>
</html>
