services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - com.centurylinklabs.watchtower.enable=true

  api:
    image: koko004/ytdownmp3-api:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - DOWNLOADS_DIR=/app/downloads
      - PORT=8081
    volumes:
      - downloads:/app/downloads
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=true

  worker:
    image: koko004/ytdownmp3-worker:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - DOWNLOADS_DIR=/app/downloads
      - WORKER_CONCURRENCY=2
      - JOB_TIMEOUT=120000
      - ADMIN_URL=http://127.0.0.1:4000
      - HEALTH_PORT=3001
    volumes:
      - downloads:/app/downloads
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=true

  frontend:
    image: koko004/ytdownmp3-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    labels:
      - com.centurylinklabs.watchtower.enable=true

  admin:
    image: koko004/ytdownmp3-admin:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - ADMIN_USER=admin
      - ADMIN_PASS=changeme123
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:latest-dev
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_INTERVAL=21600
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_STOPPED=true
    command: >
      --api-version 1.55
      --label-enable
      --cleanup
      --revive-stopped
      --interval 21600
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  redis-data:
  downloads:
